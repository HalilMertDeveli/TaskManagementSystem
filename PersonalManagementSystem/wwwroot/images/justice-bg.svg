<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8edf5"/>
      <stop offset="100%" stop-color="#f0f4fa"/>
    </linearGradient>
    <linearGradient id="colGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5cfe0"/>
      <stop offset="100%" stop-color="#a8b8d0"/>
    </linearGradient>
    <linearGradient id="scaleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9bbd"/>
      <stop offset="100%" stop-color="#6b7fa8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Decorative circles -->
  <circle cx="960" cy="540" r="380" fill="none" stroke="#c5cfe0" stroke-width="0.5" opacity="0.3"/>
  <circle cx="960" cy="540" r="320" fill="none" stroke="#c5cfe0" stroke-width="0.5" opacity="0.25"/>
  <circle cx="960" cy="540" r="260" fill="none" stroke="#c5cfe0" stroke-width="0.5" opacity="0.2"/>

  <!-- Left column -->
  <g opacity="0.12">
    <rect x="280" y="200" width="40" height="680" rx="4" fill="url(#colGrad)"/>
    <rect x="265" y="185" width="70" height="25" rx="4" fill="url(#colGrad)"/>
    <rect x="265" y="870" width="70" height="25" rx="4" fill="url(#colGrad)"/>
    <rect x="258" y="170" width="84" height="20" rx="3" fill="url(#colGrad)"/>
    <rect x="258" y="890" width="84" height="20" rx="3" fill="url(#colGrad)"/>
  </g>

  <!-- Right column -->
  <g opacity="0.12">
    <rect x="1600" y="200" width="40" height="680" rx="4" fill="url(#colGrad)"/>
    <rect x="1585" y="185" width="70" height="25" rx="4" fill="url(#colGrad)"/>
    <rect x="1585" y="870" width="70" height="25" rx="4" fill="url(#colGrad)"/>
    <rect x="1578" y="170" width="84" height="20" rx="3" fill="url(#colGrad)"/>
    <rect x="1578" y="890" width="84" height="20" rx="3" fill="url(#colGrad)"/>
  </g>

  <!-- Scale of Justice (center) -->
  <g opacity="0.15" transform="translate(960, 540)">
    <!-- Main pillar -->
    <rect x="-6" y="-180" width="12" height="360" rx="3" fill="url(#scaleGrad)"/>

    <!-- Base -->
    <rect x="-60" y="170" width="120" height="16" rx="6" fill="url(#scaleGrad)"/>
    <rect x="-40" y="160" width="80" height="16" rx="4" fill="url(#scaleGrad)"/>

    <!-- Top ornament -->
    <circle cx="0" cy="-190" r="14" fill="none" stroke="#6b7fa8" stroke-width="3"/>
    <circle cx="0" cy="-190" r="6" fill="#8a9bbd"/>

    <!-- Beam -->
    <line x1="-200" y1="-160" x2="200" y2="-160" stroke="#6b7fa8" stroke-width="5" stroke-linecap="round"/>

    <!-- Left chain -->
    <line x1="-200" y1="-160" x2="-200" y2="-60" stroke="#8a9bbd" stroke-width="2.5"/>
    <line x1="-180" y1="-160" x2="-180" y2="-50" stroke="#8a9bbd" stroke-width="2.5"/>
    <line x1="-220" y1="-160" x2="-220" y2="-50" stroke="#8a9bbd" stroke-width="2.5"/>

    <!-- Left pan -->
    <ellipse cx="-200" cy="-45" rx="65" ry="12" fill="#8a9bbd"/>
    <path d="M-265,-50 Q-200,-80 -135,-50" fill="none" stroke="#6b7fa8" stroke-width="2"/>

    <!-- Right chain -->
    <line x1="200" y1="-160" x2="200" y2="-60" stroke="#8a9bbd" stroke-width="2.5"/>
    <line x1="180" y1="-160" x2="180" y2="-50" stroke="#8a9bbd" stroke-width="2.5"/>
    <line x1="220" y1="-160" x2="220" y2="-50" stroke="#8a9bbd" stroke-width="2.5"/>

    <!-- Right pan -->
    <ellipse cx="200" cy="-45" rx="65" ry="12" fill="#8a9bbd"/>
    <path d="M135,-50 Q200,-80 265,-50" fill="none" stroke="#6b7fa8" stroke-width="2"/>
  </g>

  <!-- Gavel (bottom-right area) -->
  <g opacity="0.1" transform="translate(1350, 750) rotate(-35)">
    <rect x="-80" y="-12" width="160" height="24" rx="6" fill="#7a8aaa"/>
    <rect x="-15" y="10" width="12" height="100" rx="4" fill="#8a9bbd"/>
  </g>

  <!-- Law book (bottom-left area) -->
  <g opacity="0.1" transform="translate(550, 780)">
    <rect x="-50" y="-30" width="100" height="60" rx="4" fill="#7a8aaa"/>
    <rect x="-45" y="-25" width="90" height="50" rx="2" fill="#8a9bbd"/>
    <line x1="-20" y1="-15" x2="30" y2="-15" stroke="#a8b8d0" stroke-width="2"/>
    <line x1="-20" y1="-5" x2="25" y2="-5" stroke="#a8b8d0" stroke-width="2"/>
    <line x1="-20" y1="5" x2="28" y2="5" stroke="#a8b8d0" stroke-width="2"/>
    <line x1="-20" y1="15" x2="15" y2="15" stroke="#a8b8d0" stroke-width="2"/>
  </g>

  <!-- Laurel wreath left -->
  <g opacity="0.08" transform="translate(860, 540)">
    <path d="M0,-120 Q-30,-100 -20,-70 Q-40,-90 -35,-60 Q-55,-75 -45,-45 Q-60,-55 -50,-30 Q-65,-35 -52,-10 Q-65,-15 -50,10 Q-60,5 -45,25 Q-55,20 -40,40 Q-50,38 -30,55 Q-40,50 -20,65 Q-30,60 -10,75 Q-15,72 0,85" 
          fill="none" stroke="#6b7fa8" stroke-width="3"/>
  </g>

  <!-- Laurel wreath right -->
  <g opacity="0.08" transform="translate(1060, 540)">
    <path d="M0,-120 Q30,-100 20,-70 Q40,-90 35,-60 Q55,-75 45,-45 Q60,-55 50,-30 Q65,-35 52,-10 Q65,-15 50,10 Q60,5 45,25 Q55,20 40,40 Q50,38 30,55 Q40,50 20,65 Q30,60 10,75 Q15,72 0,85" 
          fill="none" stroke="#6b7fa8" stroke-width="3"/>
  </g>

  <!-- Subtle pattern dots -->
  <g opacity="0.04" fill="#6b7fa8">
    <circle cx="100" cy="100" r="3"/><circle cx="200" cy="100" r="3"/><circle cx="300" cy="100" r="3"/>
    <circle cx="100" cy="200" r="3"/><circle cx="200" cy="200" r="3"/><circle cx="300" cy="200" r="3"/>
    <circle cx="1620" cy="100" r="3"/><circle cx="1720" cy="100" r="3"/><circle cx="1820" cy="100" r="3"/>
    <circle cx="1620" cy="200" r="3"/><circle cx="1720" cy="200" r="3"/><circle cx="1820" cy="200" r="3"/>
    <circle cx="100" cy="880" r="3"/><circle cx="200" cy="880" r="3"/><circle cx="300" cy="880" r="3"/>
    <circle cx="100" cy="980" r="3"/><circle cx="200" cy="980" r="3"/><circle cx="300" cy="980" r="3"/>
    <circle cx="1620" cy="880" r="3"/><circle cx="1720" cy="880" r="3"/><circle cx="1820" cy="880" r="3"/>
    <circle cx="1620" cy="980" r="3"/><circle cx="1720" cy="980" r="3"/><circle cx="1820" cy="980" r="3"/>
  </g>
</svg>
